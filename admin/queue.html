<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Review queue – Grok vs. Humans admin (mockup)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/assets/v2/feed.css">
  <style>
    .q-head{display:flex;align-items:center;justify-content:space-between;padding:.25rem .25rem 0}
    .q-head h2{margin:0;font-size:1.1rem}.q-count{color:var(--muted);font-size:.8rem}
    .q-meta{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:.74rem;color:#71717a;padding:.6rem .9rem 0}
    .q-label{font-size:.75rem;color:var(--muted);padding:.65rem .9rem .3rem;font-weight:700}
    .q-topics{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 .9rem .3rem}
    .q-topics .chip{font-size:.78rem;padding:.3rem .7rem}
    .q-topics .chip.sug{border-style:dashed}
    .q-title{width:calc(100% - 1.8rem);margin:.2rem .9rem .3rem;background:#09090b;border:1px solid #3f3f46;border-radius:.6rem;color:#fff;font:inherit;font-weight:700;padding:.5rem .6rem;font-size:16px}
    .q-btns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:.8rem .9rem .9rem}
    .q-btns button{border:0;border-radius:.8rem;padding:.85rem;font-weight:800;font-size:.95rem}
    .q-approve{background:#15803d;color:#fff}.q-skip{background:#27272a;color:#e4e4e7;border:1px solid #3f3f46!important}
    .q-feature{grid-column:1/-1;background:var(--grad);color:#000}
    .q-done{color:var(--muted);text-align:center;padding:3rem 1rem}
  </style>
</head>
<body>
  <div class="mock-banner">MOCKUP · admin review queue · candidates are placeholder examples, nothing is saved</div>
  <header class="top">
    <a href="/" class="top__logo"><span class="top__g">G</span><span class="top__name">Review <em>queue</em></span></a>
    <span class="me"><img src="/assets/images/users/@SlavisTon.webp" alt="">@SlavisTon</span>
  </header>
  <nav class="bar"><div class="tabs">
    <button class="tab is-on">📥 Pending <span id="n"></span></button>
    <button class="tab" onclick="mockToast('Approved posts list')">✅ Approved</button>
    <button class="tab" onclick="mockToast('Skipped (restorable for 30 days)')">⏭ Skipped</button>
    <button class="tab" onclick="mockToast('Comments moderation (existing /admin)')">💬 Comments</button>
  </div></nav>
  <main class="feed" id="q"></main>
  <div id="toast" class="toast"></div>
<script>
(function(){
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const $=s=>document.querySelector(s);
  window.mockToast=function(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(mockToast.t);mockToast.t=setTimeout(()=>t.classList.remove('show'),2200);return false;};
  let topics=[],items=[],i=0;
  const SRC=['search: to:grok OR @grok -is:retweet','search: from:grok is:reply','mentions of @SlavisTon'];
  function msg(side,m){return `<div class="msg msg--${side}"><img class="msg__av" src="${esc(m.avatar)}" alt="" onerror="this.style.visibility='hidden'"><div class="msg__b"><div class="msg__h">${side==='grok'?'🤖 ':''}${esc(m.handle)}</div><p class="msg__t clamp">${esc(m.text)}</p>${m.media?`<img class="msg__m" src="${esc(m.media)}" alt="">`:''}</div></div>`;}
  function render(){
    $('#n').textContent='('+(items.length-i)+')';
    if(i>=items.length){$('#q').innerHTML='<div class="q-done">🎉 Queue empty. Next fetch runs at 6:00 AM CT.</div>';return;}
    const c=items[i];
    $('#q').innerHTML=`<div class="q-head"><h2>Candidate ${i+1} of ${items.length}</h2><span class="q-count">${esc(c.engagement)}</span></div>
    <article class="post">
      <div class="q-meta"><span><i class="fa-solid fa-magnifying-glass"></i> ${esc(c.source)}</span><span>fetched ${esc(c.fetched)}</span><span class="example">EXAMPLE</span></div>
      <div class="q-label">Headline (editable)</div>
      <input class="q-title" value="${esc(c.title)}" aria-label="Headline">
      <div class="ex">${msg('human',c.human)}${msg('grok',c.grok)}</div>
      <div class="q-label">Topics — dashed = suggested (${esc(c.how)}), tap to change</div>
      <div class="q-topics">${topics.map(t=>`<button class="chip ${c.sel.includes(t)?'is-on':''} ${c.sug.includes(t)?'sug':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <div class="q-btns">
        <button class="q-skip" data-a="skip"><i class="fa-solid fa-forward"></i> Skip</button>
        <button class="q-approve" data-a="approve"><i class="fa-solid fa-check"></i> Approve</button>
        <button class="q-feature" data-a="feature"><i class="fa-solid fa-star"></i> Approve + feature</button>
      </div>
      <div class="acts"><a class="act" href="${esc(c.xLink)}" target="_blank" rel="noopener">Open on X <i class="fa-solid fa-arrow-up-right-from-square"></i></a><button class="act" onclick="mockToast('Blocked this author from future fetches')"><i class="fa-solid fa-ban"></i> Never from this author</button></div>
    </article>`;
  }
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-t]');
    if(t){const c=items[i],v=t.dataset.t;c.sel=c.sel.includes(v)?c.sel.filter(x=>x!==v):[...c.sel,v].slice(-3);return render();}
    const a=e.target.closest('[data-a]'); if(!a)return;
    const c=items[i]; if(a.dataset.a!=='skip'&&!c.sel.length)return mockToast('Pick at least one topic');
    mockToast({skip:'Skipped',approve:'Approved → live in feed ('+c.sel.join(', ')+')',feature:'Approved + featured ⭐ (pinned in Hot for 24h)'}[a.dataset.a]);
    i++;render();window.scrollTo({top:0});
  });
  fetch('/data/v2-sample.json').then(r=>r.json()).then(d=>{
    topics=d.topics;
    items=d.posts.slice(0,6).map((p,k)=>({...p,source:SRC[k%3],fetched:(k+1)*7+'m ago',engagement:(120+k*97)+' likes · '+(14+k*5)+' replies',
      sug:p.topics.slice(0,2),sel:p.topics.slice(0,2),how:k%2?'keyword rules':'Grok-mini, ~$0.0001'}));
    render();
  });
})();
</script>
</body>
</html>
